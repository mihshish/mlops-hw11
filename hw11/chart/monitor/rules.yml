groups:
  - name: lab11
    rules:
      - alert: HighTTFC
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ml_ttfc_seconds_bucket{job="api"}[30s]))) > 0.8
          and sum(increase(ml_ttfc_seconds_count{job="api"}[30s])) >= 8
        for: 15s
        labels: {severity: warning}
        annotations: {summary: 'p95 TTFC > 0.8 s with at least 8 successful responses in 30 s'}
      - alert: HighRejectionRate
        expr: |
          (sum(increase(ml_requests_total{job="api",outcome="rejected"}[30s])) / sum(increase(ml_requests_total{job="api"}[30s]))) > 0.12
          and sum(increase(ml_requests_total{job="api"}[30s])) >= 15
        for: 15s
        labels: {severity: warning}
        annotations: {summary: 'Rejection ratio > 12% with at least 15 outcomes in 30 s'}
