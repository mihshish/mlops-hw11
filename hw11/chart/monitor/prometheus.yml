global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/lab/rules.yml]
scrape_configs:
  - job_name: api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [hw11]}
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name], regex: 'hw11-api;http', action: keep}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_pod_label_model_version], target_label: version}
  - job_name: ready-endpoint
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [hw11]}
    relabel_configs:
      - {source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_endpoint_conditions_ready, __meta_kubernetes_endpointslice_port_name], regex: 'balanced;true;http', action: keep}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: '.*', action: drop}
  - job_name: kubelet-cadvisor
    scrape_interval: 15s
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs: [{role: node}]
    relabel_configs:
      - {target_label: __address__, replacement: 'kubernetes.default.svc:443'}
      - {source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: '/api/v1/nodes/${1}/proxy/metrics/cadvisor'}
    metric_relabel_configs:
      - {source_labels: [__name__, namespace, container], regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes);hw11;api', action: keep}
